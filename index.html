<style>
:root{--beige:#F4ECE2;--paper:#FFFAF5;--peach:#F7CBB5;--rose:#A9716F;--rose-deep:#6E4246;--lilac:#CBB8E8;--lilac-soft:#ECE4F7;--ink:#3A2629;--muted:#80696A;--line:#E4D5C8;color-scheme:light}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--beige);color:var(--ink);font-family:"Figtree",system-ui,sans-serif;display:grid;place-items:center;padding:20px;overflow:hidden}
.b{position:fixed;border-radius:50%;z-index:-1}
.card{background:var(--paper);border:1px solid var(--line);border-radius:30px;padding:36px 32px;width:min(420px,100%);display:grid;gap:18px;box-shadow:0 30px 60px -36px rgba(58,38,41,.5)}
h1{font-family:"Shrikhand",Georgia,serif;font-weight:400;font-size:38px;line-height:1.02;color:var(--rose-deep);margin:0}
p{margin:0;color:var(--muted)}
label{font-weight:700;font-size:15px;display:block;margin-bottom:7px}
input{width:100%;border:1.5px solid var(--line);background:#fff;border-radius:14px;padding:13px 15px;font:inherit;font-size:16px}
input:focus{outline:none;border-color:#7B63A6;box-shadow:0 0 0 3px var(--lilac-soft)}
button{border:0;border-radius:999px;padding:13px 20px;font:inherit;font-weight:800;font-size:16px;background:var(--ink);color:var(--paper);cursor:pointer;width:100%}
button:hover{background:var(--rose-deep)}
button[disabled]{opacity:.6;cursor:wait}
.err{color:#A23B3B;font-weight:700;font-size:14px;min-height:20px}
.tag{font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--rose)}
</style>
</head>

<script>
const ITER = 250000;
const b64 = s => Uint8Array.from(atob(s), c=>c.charCodeAt(0));
const tob64 = u => { let s=""; for(let i=0;i<u.length;i++) s+=String.fromCharCode(u[i]); return btoa(s); };
const raw = b64(document.getElementById("payload").textContent.trim());
const salt = raw.slice(0,16), iv = raw.slice(16,28), ct = raw.slice(28);
async function open(bits){
  const key = await crypto.subtle.importKey("raw", bits, "AES-GCM", false, ["decrypt"]);
  const pt = await crypto.subtle.decrypt({name:"AES-GCM", iv}, key, ct);
  sessionStorage.setItem("tuc-key", tob64(new Uint8Array(bits)));
  const html = new TextDecoder().decode(pt);
  document.open(); document.write(html); document.close();
}
(async ()=>{ const k = sessionStorage.getItem("tuc-key"); if(k){ try{ await open(b64(k)); }catch(e){ sessionStorage.removeItem("tuc-key"); } } })();
document.getElementById("f").addEventListener("submit", async e=>{
  e.preventDefault();
  const err = document.getElementById("err"), go = document.getElementById("go");
  const code = document.getElementById("code").value.trim().toLowerCase();
  if(!code){ err.textContent = "Enter the access code."; return; }
  go.disabled = true; go.textContent = "Checking…"; err.textContent = "";
  try{
    const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(code), "PBKDF2", false, ["deriveBits"]);
    const bits = await crypto.subtle.deriveBits({name:"PBKDF2", salt, iterations:ITER, hash:"SHA-256"}, base, 256);
    await open(new Uint8Array(bits));
  }catch(x){
    err.textContent = "That code doesn't work. Check it and try again.";
    go.disabled = false; go.textContent = "Enter";
  }
});
</script>
